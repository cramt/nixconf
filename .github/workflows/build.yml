name: Build & Cache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # update.yml dispatches this on the `update` branch, because its
  # GITHUB_TOKEN push can't fire the pull_request trigger itself.
  workflow_dispatch:

jobs:
  # Enumerate flake packages -> a build matrix consumed via fromJSON below.
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      hosts: ${{ steps.gen.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4

      # Dispatched runs (from update.yml) create check suites GitHub doesn't
      # associate with PRs, so the update PR would show no checks at all.
      # Commit statuses are SHA-based and do show in the PR merge box — post
      # pending here, and the report job below posts the final state.
      - name: Mark commit status pending
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="Build & Cache" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # access-tokens authenticates flake input fetches. Anonymous
          # api.github.com allows 60 requests/hour per IP and Actions runners
          # share egress IPs, so tarball fetches intermittently 429 and fail the
          # build — that is what took out luna and three prebuild legs. A token raises the
          # limit to 5000/hour. Set on every nix-installer step in this repo.
          extra-conf: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}

      - id: gen
        run: ./.github/scripts/build-matrix.sh

  # Prebuild every flake package on its own runner and push to cachix. These are
  # the cache-miss-by-construction derivations (ROCm/CUDA llama.cpp, overlay
  # patches); building them in isolation means each finishes within the 6h cap
  # and gets cached, so the host builds below substitute instead of compiling.
  prebuild:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: wimpysworld/nothing-but-nix@main
        # Build scratch lives on the /nix pool (build-dir below), so nothing
        # needs to be held back on / — every GB there belongs in the pool.
        # Rampage because some ubuntu-latest runners come with a 72G root
        # that is already full and a 13G /mnt: under cleave plus the old 16G
        # root reserve the pool topped out at 29G and filled mars on
        # 2026-11-03, while 16G sat unused on /. The build jobs need nothing
        # from the runner image beyond what rampage leaves.
        with:
          hatchet-protocol: rampage

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # build-dir: put builds on the reclaimed /nix pool, as
          # nothing-but-nix expects; it creates /nix/build but leaves the
          # setting to us. fallback: a substituter that dies mid-download
          # (cache.numtide.com's HTTP 416s on resume took out ganymede on
          # 2026-11-03) builds that path instead of failing the whole leg.
          extra-conf: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            build-dir = /nix/build
            fallback = true

      - uses: cachix/cachix-action@v17
        with:
          name: cramt
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The daemon fails the job when an upload stalls past its hard 60s
          # shutdown drain, even with every path already pushed (saturn,
          # venus-img, flash-venus on 2026-11-04). Plain `cachix push` in the
          # post step has no such cap. Go back to the daemon once a cachix
          # release ships https://github.com/cachix/cachix/pull/749 (bounded
          # stalled requests; unreleased after 1.13.0).
          useDaemon: false

      # Felix (nix.package on every host) is never in a public cache, so legs
      # compile it, and its functional tests nest the Nix sandbox. Ubuntu
      # 24.04 images strip capabilities from unprivileged user namespaces via
      # AppArmor, so nested unshare fails and the tests' golden output gains
      # "auto-disabling sandboxing". The runner image keeps this on by design
      # (https://github.com/actions/runner-images/issues/10443); drop the step
      # if the images ever ship with it off.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build ${{ matrix.package }} (${{ matrix.system }})
        run: nix build ".#packages.${{ matrix.system }}.${{ matrix.package }}" --print-build-logs

  # Build each host toplevel. needs:prebuild only for ordering (warm cache);
  # if:!cancelled() lets these run even if a prebuild leg failed, so a single
  # bad package never blocks the host builds — they just fall back to compiling.
  build:
    needs: [matrix, prebuild]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      # One leg per host, from build-matrix.sh. mercury's leg matters most:
      # its kernel is Terasic's fork via nixos-fpga, which Hydra has never
      # seen, and nixos-fpga's CI only caches it against *its* nixpkgs lock —
      # this is what guarantees the exact closure lands in cachix.
      matrix: ${{ fromJSON(needs.matrix.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: wimpysworld/nothing-but-nix@main
        # Build scratch lives on the /nix pool (build-dir below), so nothing
        # needs to be held back on / — every GB there belongs in the pool.
        # Rampage because some ubuntu-latest runners come with a 72G root
        # that is already full and a 13G /mnt: under cleave plus the old 16G
        # root reserve the pool topped out at 29G and filled mars on
        # 2026-11-03, while 16G sat unused on /. The build jobs need nothing
        # from the runner image beyond what rampage leaves.
        with:
          hatchet-protocol: rampage

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # build-dir: put builds on the reclaimed /nix pool, as
          # nothing-but-nix expects; it creates /nix/build but leaves the
          # setting to us. fallback: a substituter that dies mid-download
          # (cache.numtide.com's HTTP 416s on resume took out ganymede on
          # 2026-11-03) builds that path instead of failing the whole leg.
          extra-conf: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            build-dir = /nix/build
            fallback = true

      - uses: cachix/cachix-action@v17
        with:
          name: cramt
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The daemon fails the job when an upload stalls past its hard 60s
          # shutdown drain, even with every path already pushed (saturn,
          # venus-img, flash-venus on 2026-11-04). Plain `cachix push` in the
          # post step has no such cap. Go back to the daemon once a cachix
          # release ships https://github.com/cachix/cachix/pull/749 (bounded
          # stalled requests; unreleased after 1.13.0).
          useDaemon: false

      # Felix (nix.package on every host) is never in a public cache, so legs
      # compile it, and its functional tests nest the Nix sandbox. Ubuntu
      # 24.04 images strip capabilities from unprivileged user namespaces via
      # AppArmor, so nested unshare fails and the tests' golden output gains
      # "auto-disabling sandboxing". The runner image keeps this on by design
      # (https://github.com/actions/runner-images/issues/10443); drop the step
      # if the images ever ship with it off.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build ${{ matrix.host }}
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --print-build-logs

  # Final commit status for dispatched runs (see the pending step in matrix).
  # Success requires prebuild AND build green, mirroring the run conclusion.
  report:
    needs: [prebuild, build]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark final commit status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ (needs.prebuild.result == 'success' && needs.build.result == 'success') && 'success' || 'failure' }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="Build & Cache" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
