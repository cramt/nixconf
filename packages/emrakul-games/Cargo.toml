[package]
name = "emrakul-games"
version = "0.1.0"
edition = "2024"
description = "Home tiles for every app on every Sunshine host Moonlight is paired with"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
png = "0.17"
roxmltree = "0.20"
# ring, not aws-lc: no cmake or C toolchain dance in the nix build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
